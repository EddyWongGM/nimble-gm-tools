<!doctype html>
<html environmentJSON="{{ environmentJSON }}">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{ googleAnalyticsId }}"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied"
      });

      gtag("config", "{{ googleAnalyticsId }}");
    </script>
    <link
      rel="stylesheet"
      type="text/css"
      href="/css/nimble-rpg-app.{{ appVersion }}.css"
    />
    <link rel="icon" type="image/png" href="/img/nimblerpgapp-transparent-blue.png" />
    <meta
      name="description"
      content="Track combat on the Nimble RPG App player view."
    />
    <meta
      property="og:image"
      content="/img/nimblerpgapp-transparent-blue.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-language" content="en-us" />

    <title>Player View - Nimble RPG App</title>

    <script
      type="text/javascript"
      src="/js/NimbleRPGApp.{{ appVersion }}.js"
    ></script>
  </head>

  <body id="playerview">
    <div id="playerview__container"></div>
  </body>
</html>
