<!doctype html>
<html environmentJSON="{{ environmentJSON }}">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{ googleAnalyticsId }}"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied"
      });

      gtag("config", "{{ googleAnalyticsId }}");
    </script>
    <link
      rel="stylesheet"
      type="text/css"
      href="/css/nimble-rpg-app.{{ appVersion }}.css"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/img/nimblerpgapp-transparent-blue.png" />
    <meta
      name="description"
      content="The original combat tracker for the Nimble TTRPG. Prep and run fast, adaptable combat encounters without getting between you and your players."
    />
    <meta property="og:image" content="/img/book-white-on-black-512.png" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <meta http-equiv="content-language" content="en-us" />

    <title>Nimble RPG App</title>

    <script
      type="text/javascript"
      src="/js/NimbleRPGApp.{{ appVersion }}.js"
    ></script>
    <style type="text/css">
      .loading-splash {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: flex;
        flex-flow: column;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        background-color: rgba(1, 1, 1, 0.7);
      }

      .loading-splash img {
        animation: bob 1s ease infinite;
      }

      @keyframes bob {
        0% {
          margin-top: 0;
        }
        50% {
          margin-top: 20px;
        }
      }
    </style>
  </head>

  <body id="tracker">
    <div id="fb-root"></div>
    <script>
      (function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "//connect.facebook.net/en_US/sdk.js#xfbml=1&version=v2.10";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");
    </script>
    <div class="loading-splash">
      <img src="../img/book-white-on-black-192.png" alt="Nimble RPG App Logo" />
      <p>Loading Nimble RPG App</p>
    </div>
    <div id="app__container"></div>
  </body>
</html>
